[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "boundaryx"
version = "0.2.0"
description = "Task-relative preservation and reproducible evidence across A2A and MCP boundaries"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
boundaryx = "boundaryx.cli:main"
interop-research = "interoperability.cli:main"

[project.optional-dependencies]
dev = ["ruff==0.14.4", "mypy==1.18.2", "build==1.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120
include = ["src/boundaryx/**/*.py", "tests/test_boundaryx*.py", "scripts/boundaryx.py", "scripts/prepare_boundaryx_review.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["src/boundaryx"]
check_untyped_defs = true
warn_unused_ignores = true
follow_imports = "skip"

